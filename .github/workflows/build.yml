name: Build Windows Application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Support
        run: flutter config --enable-windows-desktop

      - name: Inject Custom Bypasses & Features
        shell: powershell
        run: |
          Write-Host "1. Bypassing Subscription Check..."
          Get-ChildItem -Path lib -Recurse -Filter "*.dart" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match "isSupporter") {
              $updated = $content -replace 'bool\s+get\s+isSupporter\s*=>\s*[^;]+;', 'bool get isSupporter => true;'
              Set-Content -Path $_.FullName -Value $updated
            }
          }

          Write-Host "2. Adding Offline Recommendation Algorithm..."
          $algo = @"

          // Custom Offline Recommendation Algorithm
          List<dynamic> getSmartOfflineSuggestions(List<dynamic> allTracks, dynamic currentTrack) {
            var unplayed = allTracks.where((t) => (t.playCount ?? 0) == 0).toList()..shuffle();
            var lowPlayed = allTracks.where((t) => (t.playCount ?? 0) > 0 && (t.playCount ?? 0) < 3).toList()..shuffle();
            return [...unplayed.take(5), ...lowPlayed.take(5)];
          }
          "@
          Add-Content -Path "lib/main.dart" -Value $algo

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Upload Application Executable
        uses: actions/upload-artifact@v4
        with:
          name: Harmonoid-Custom-Windows
          path: build/windows/runner/Release/