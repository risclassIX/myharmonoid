name: Build Windows Application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Support
        run: flutter config --enable-windows-desktop

      - name: Inject Bypasses, Video Player & Suggestion Algorithm
        shell: powershell
        run: |
          Write-Host "1. Bypassing Subscription/Supporter Check..."
          Get-ChildItem -Path lib -Recurse -Filter "*.dart" | ForEach-Object {
            (Get-Content $_.FullName) -replace 'bool get isSupporter => .*', 'bool get isSupporter => true;' | Set-Content $_.FullName
          }

          Write-Host "2. Injecting Offline Recommendation Logic..."
          $algoCode = @"
          List<dynamic> getSmartOfflineSuggestions(List<dynamic> allTracks, dynamic currentTrack) {
            var unplayed = allTracks.where((t) => (t.playCount ?? 0) == 0).toList()..shuffle();
            var lowPlayed = allTracks.where((t) => (t.playCount ?? 0) > 0 && (t.playCount ?? 0) < 3).toList()..shuffle();
            var sameGenre = allTracks.where((t) => t.genre == currentTrack?.genre && t != currentTrack).toList()..shuffle();
            return [...unplayed.take(5), ...lowPlayed.take(3), ...sameGenre.take(2)];
          }
          "@
          Add-Content -Path "lib/main.dart" -Value "`n$algoCode"

          Write-Host "3. Adding SUGGESTIONS Tab to Nav Bar..."
          $navFile = "lib/interface/navigation_bar.dart"
          if (Test-Path $navFile) {
            (Get-Content $navFile) -replace "Tab\(text: 'GENRES'\),", "Tab(text: 'GENRES'), Tab(text: 'SUGGESTIONS')," | Set-Content $navFile
          }

          Write-Host "4. Injecting Floating Video Player Icon..."
          $playerFile = "lib/interface/now_playing_bar.dart"
          if (Test-Path $playerFile) {
            $videoCode = 'IconButton(icon: Icon(Icons.video_collection), onPressed: () => showDialog(context: context, builder: (c) => Dialog(child: SizedBox(width: 800, height: 450, child: Stack(children: [Video(controller: controller), Positioned(top: 8, right: 8, child: IconButton(icon: Icon(Icons.close), onPressed: () => Navigator.of(c).pop()))]))))),'
            (Get-Content $playerFile) -replace "IconButton\(icon: Icon\(Icons.queue_music\)", "$videoCode IconButton(icon: Icon(Icons.queue_music)" | Set-Content $playerFile
          }

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Upload Application Executable
        uses: actions/upload-artifact@v3
        with:
          name: Harmonoid-Custom-Windows
          path: build/windows/runner/Release/